  <path d="M692 56l3-7 3 7 7 3-7 3-3 7-3-7-7-3z" fill="#93ecca"/>
  <path d="M1141 57l4-9 4 9 9 4-9 4-4 9-4-9-9-4z" fill="#b4a7ff"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="68" y="52" width="235" height="31" rx="15.5" fill="#ffffff" opacity="0.1"/>
    <circle cx="85" cy="67.5" r="5" fill="#8ff0ce"/>
    <text x="100" y="73" fill="#e7e8ff" font-size="14" font-weight="700" letter-spacing="2">THE CURATED UNIVERSE</text>
    <text x="67" y="150" fill="#ffffff" font-size="64" font-weight="900" letter-spacing="-3">AWESOME</text>
    <text x="64" y="222" fill="url(#headline)" font-size="66" font-weight="900" letter-spacing="-3">AI PROJECTS</text>
    <text x="69" y="272" fill="#d6daf5" font-size="20">Find your next open-source rabbit hole.</text>
    <text x="69" y="316" fill="#a8acd0" font-size="13" font-weight="700" letter-spacing="2">BUILD  ·  PLAY  ·  EXPLORE</text>
  </g>

