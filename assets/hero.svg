<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Awesome AI Projects</title>
  <desc id="description">A playful night-sky map with colorful open-source AI project cards orbiting a star.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11142f"/>
      <stop offset="0.56" stop-color="#1b2050"/>
      <stop offset="1" stop-color="#302159"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#91f0ce"/>
      <stop offset="0.54" stop-color="#b5a4ff"/>
      <stop offset="1" stop-color="#ffb37f"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b7b9ea" opacity="0.12"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#night)"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>

  <g fill="#fff" opacity="0.56">
    <circle cx="43" cy="64" r="2"/><circle cx="335" cy="43" r="1.7"/>
    <circle cx="537" cy="65" r="1.5"/><circle cx="678" cy="317" r="1.7"/>
    <circle cx="801" cy="55" r="1.3"/><circle cx="956" cy="42" r="2"/>
    <circle cx="1135" cy="108" r="1.8"/><circle cx="1114" cy="302" r="1.4"/>
    <circle cx="722" cy="126" r="1.3"/><circle cx="1036" cy="220" r="1.6"/>
  </g>
